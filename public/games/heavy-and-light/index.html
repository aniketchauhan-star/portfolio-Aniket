<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Heavy and Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{
    --stage-w: 1920px;
    --stage-h: 1080px;
    --ink: #3B2A1B;
    --gold: #FFC53D;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    width:100%; height:100%; height:100dvh;
    overflow:hidden; background:#0E1B2A; overscroll-behavior:none;
  }
  body{
    position:fixed; inset:0;
    font-family:"Lilita One","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
    touch-action:none; user-select:none;
  }

  /* blurred edge-filler so any leftover bar never reads as a black border */
  #backdrop{
    position:fixed; inset:-6%;
    background:#1a3550 center/cover no-repeat;
    filter:blur(46px) brightness(.62) saturate(1.15);
    transform:scale(1.14); z-index:0;
    transition:background-image .4s ease;
  }
  #backdrop::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%);
  }


  /* ---------- 16:9 stage that scales to fit any screen ---------- */
  #stage{
    position:absolute; left:50%; top:50%;
    width:var(--stage-w);  min-width:var(--stage-w);  max-width:var(--stage-w);
    height:var(--stage-h); min-height:var(--stage-h); max-height:var(--stage-h);
    flex:0 0 auto;
    aspect-ratio:16 / 9;
    transform-origin:50% 50%;
    transform:translate(-50%,-50%) scale(1);
    overflow:hidden;
    z-index:1;
    border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.10);
    background:#8ED0F0;
  }
  .layer{ position:absolute; inset:0; }
  .bg{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- loading ---------- */

  /* ---------- start screen ---------- */
  #startScreen{ z-index:20; }
  /* The play button is hidden until every asset is in. #preBar sits in its
     place meanwhile, so the start screen is never showing a button that
     isn't ready to be pressed. */
  #startBtn[hidden]{ display:none; }
  #preBar{
    position:absolute; z-index:22; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    /* the start screen behind it is busy, so the bar gets its own ground */
    padding:20px 26px 18px; border-radius:28px;
    background:rgba(18,32,52,.45);
    box-shadow:0 10px 30px rgba(0,0,0,.30), inset 0 0 0 2px rgba(255,255,255,.16);
  }
  #preBar[hidden]{ display:none; }
  #preTrack{
    width:100%; height:30px; border-radius:99px;
    background:rgba(255,255,255,.34);
    box-shadow:inset 0 4px 10px rgba(0,0,0,.18), 0 0 0 6px rgba(255,255,255,.30);
    overflow:hidden;
  }
  #preFill{
    width:0%; height:100%; border-radius:99px;
    background:linear-gradient(90deg,#FFD24A,#FF9A3D,#FF6FA5);
    transition:width .22s ease-out;
  }
  #preTxt{
    font-size:30px; color:#fff; letter-spacing:2px;
    text-shadow:0 4px 0 rgba(0,0,0,.22);
  }
  #startBtn{
    position:absolute; width:275px; height:294px;
    left:698px; top:641px;
    border:0; background:transparent; padding:0; cursor:pointer;
    filter:drop-shadow(0 16px 22px rgba(0,0,0,.32));
    animation:btnIdle 2.2s ease-in-out infinite;
    transform-origin:50% 50%;
  }
  #startBtn img{ width:100%; height:100%; display:block; pointer-events:none; }
  #startBtn::after{
    content:""; position:absolute; inset:-16px; border-radius:50%;
    box-shadow:0 0 0 0 rgba(255,255,255,.75);
    animation:ring 2.7s ease-out infinite; pointer-events:none;
  }
  @keyframes btnIdle{
    0%,100%{ transform:translateY(0) scale(1) }
    50%    { transform:translateY(-16px) scale(1.045) }
  }
  @keyframes ring{
    0%  { box-shadow:0 0 0 0 rgba(255,255,255,.55) }
    70% { box-shadow:0 0 0 46px rgba(255,255,255,0) }
    100%{ box-shadow:0 0 0 0 rgba(255,255,255,0) }
  }
  #tapHint[hidden]{ display:none; }
  #tapHint{
    position:absolute; left:0; right:0; top:600px; text-align:center;
    font-size:36px; font-weight:800; color:#fff; letter-spacing:2px;
    text-shadow:0 4px 0 rgba(0,0,0,.22);
    animation:hintPulse 2.2s ease-in-out infinite; pointer-events:none;
  }
  @keyframes hintPulse{ 0%,100%{ opacity:.55; transform:translateY(0) } 50%{ opacity:1; transform:translateY(-6px) } }

  /* ---------- game screen ---------- */
  #gameScreen{ z-index:10; visibility:hidden; }
  #gameBg{ transform-origin:50% 62%; }

  #birdWrap{ position:absolute; left:0; top:0; width:0; height:0; will-change:transform; }
  .birdLayer{
    position:absolute; left:0; top:0;
    background-repeat:no-repeat;
    image-rendering:auto;
    will-change:transform, background-position, opacity;
    filter:drop-shadow(0 14px 14px rgba(40,30,10,.28));
    backface-visibility:hidden;
  }
  #birdB{ opacity:0; }
  #shadow{
    position:absolute; left:0; top:0; width:210px; height:46px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(60,45,20,.42) 0%, rgba(60,45,20,.16) 55%, rgba(60,45,20,0) 72%);
    transform:translate(-9999px,-9999px); will-change:transform,opacity;
  }

  #againBtn{
    position:absolute; left:50%; bottom:88px; z-index:40;
    transform:translateX(-50%) scale(0);
    border:0; cursor:pointer; font-family:inherit;
    font-size:58px; color:#5A3210; letter-spacing:1px;
    padding:22px 68px 26px; border-radius:999px;
    background:linear-gradient(180deg,#FFE888 0%,#FFC53D 55%,#F0980F 100%);
    box-shadow:0 12px 0 #C4760A, 0 22px 40px rgba(0,0,0,.38), inset 0 0 0 7px #FFF6D8;
  }
  #againBtn[hidden]{ display:none; }
  #againBtn.live{ animation:againIdle 1.9s ease-in-out infinite; }
  #againBtn:active{ animation:none; transform:translateX(-50%) translateY(7px) scale(.97); box-shadow:0 5px 0 #C4760A, 0 10px 20px rgba(0,0,0,.35), inset 0 0 0 7px #FFF6D8; }
  @keyframes againIdle{
    0%,100%{ transform:translateX(-50%) scale(1) }
    50%    { transform:translateX(-50%) scale(1.05) }
  }

  /* A 16:9 stage inside a tall phone collapses to an unreadable strip, so ask
     for landscape instead of shipping 10px text. Only on small screens: a
     portrait tablet is still big enough to play. */
  #rotate{
    position:fixed; inset:0; z-index:120; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:34px;
    background:linear-gradient(180deg,#6EC6F5 0%,#A7E36F 100%);
    color:#fff; text-align:center; padding:32px;
  }
  #rotate.show{ display:flex; }
  #rotate svg{ width:150px; height:150px; animation:tipOver 2.2s ease-in-out infinite; }
  #rotate p{ font-size:40px; line-height:1.3; text-shadow:0 4px 0 rgba(0,0,0,.18); max-width:16em; }
  @keyframes tipOver{
    0%,42%   { transform:rotate(0deg) }
    58%,100% { transform:rotate(-90deg) }
  }

  #sndBtn{
    position:absolute; right:26px; bottom:24px; z-index:95;
    border:0; border-radius:999px; cursor:pointer;
    padding:14px 26px; font-family:inherit; font-size:26px; color:#3B2A1B;
    background:#fffdf6; box-shadow:0 8px 0 rgba(0,0,0,.12), 0 12px 26px rgba(0,0,0,.28);
    animation:hintPulse 2.2s ease-in-out infinite;
  }
  #sndBtn[hidden]{ display:none; }

  /* ---------- scene 4: gate, question bar, fruit ---------- */
  #gate{ position:absolute; inset:0; z-index:80; pointer-events:none; visibility:hidden; }
  /* The panel art is a rounded rectangle — its corners are ~64% transparent,
     so on their own the two halves leave the screen corners showing. Each
     half rides on a solid slab in the panel's own gold, which fills those
     corners and the hairline at the seam. */
  .gateBack{
    position:absolute; top:-4px; width:964px; height:1088px;
    background:linear-gradient(180deg,#FBC63C 0%,#F4AE25 55%,#E07A08 100%);
  }
  #gate img{ position:absolute; width:979px; height:1190px; top:-52.6px; }
  #gateR{ transform:scaleX(-1); }

  #qbar{ position:absolute; z-index:30; opacity:0; pointer-events:none; }
  #qbar img{ width:100%; height:100%; display:block; }
  #qbarText{
    position:absolute; display:flex; align-items:center; justify-content:center;
    text-align:center; color:var(--ink); font-size:40px; line-height:1.15;
    letter-spacing:.3px; padding:0 14px;
  }
  .thing{ position:absolute; opacity:0; z-index:12; will-change:transform,left,top; }
  .thing, #stoneImg{ pointer-events:auto; cursor:grab; touch-action:none; }
  .thing.held, #stoneImg.held{ cursor:grabbing; }

  /* ---------- scene 3 props ---------- */
  #sitBird, #stoneImg{ position:absolute; opacity:0; will-change:transform,left,top; }
  #sitBird{ z-index:8; }   /* in front of the pan, not tucked behind the rim */
  #stoneImg{ z-index:7; transform-origin:50% 70%; }
  #balance{ z-index:5; }
  #tableImg{ position:absolute; opacity:0; z-index:6; transform-origin:50% 100%; }
  #birdWrap{ z-index:15; }
  #bubble{ z-index:25; }

  .dirArrow{
    position:absolute; width:104px; height:196px; opacity:0; z-index:12;
    pointer-events:none; will-change:transform,opacity;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));
  }
  .dirArrow svg{ width:100%; height:100%; display:block; }
  .dirArrow.go.down{ animation:bobDown 1.6s ease-in-out infinite; }
  .dirArrow.go.up  { animation:bobUp   1.6s ease-in-out infinite; }
  @keyframes bobDown{ 0%,100%{ transform:translateY(-16px) scale(1) } 50%{ transform:translateY(16px) scale(1.07) } }
  @keyframes bobUp  { 0%,100%{ transform:translateY(16px)  scale(1) } 50%{ transform:translateY(-16px) scale(1.07) } }

  #hand{
    position:absolute; width:100px; height:141px; opacity:0; z-index:22;
    pointer-events:none; will-change:transform,opacity;
    filter:drop-shadow(0 4px 7px rgba(0,0,0,.38));
  }
  #hand img{ width:100%; height:100%; display:block; }

  /* ---------- the balance ---------- */
  #balance{ position:absolute; inset:0; pointer-events:none; }
  .part{ position:absolute; opacity:0; will-change:transform,opacity; }
  .part img{ width:100%; height:100%; display:block; }
  #pBeam img{ transform-origin:52.24% 49.26%; }        /* the hub */
  #pTrayL img, #pTrayR img{ transform-origin:47.85% 11.02%; }  /* the hanging ring */
  #pCol img, #pBase img{ transform-origin:50% 100%; }

  #hammer{
    position:absolute; width:150px; height:200px; opacity:0;
    pointer-events:none; will-change:transform,opacity;
    filter:drop-shadow(0 10px 12px rgba(0,0,0,.3));
  }
  #hammer svg{ width:100%; height:100%; display:block; }

  /* ---------- speech bubble ---------- */
  #bubble{
    position:absolute; left:499px; width:940px; bottom:492px;
    background:#fffdf6; border:6px solid var(--gold);
    border-radius:34px; padding:16px 30px 20px;
    box-shadow:0 18px 0 rgba(0,0,0,.10), 0 26px 44px rgba(0,0,0,.22);
    text-align:center; opacity:0; transform:scale(.2); transform-origin:50% 120%;
    pointer-events:none;
  }
  #bubbleText{
    font-size:48px; font-weight:400; line-height:1.24; color:var(--ink); letter-spacing:.3px;
    text-wrap:balance;
  }
  #bubble .tail, #bubble .tailIn{
    position:absolute; left:50%; width:0; height:0; border-style:solid;
  }
  #bubble .tail{
    bottom:-36px; margin-left:-27px;
    border-width:36px 27px 0 27px;
    border-color:var(--gold) transparent transparent transparent;
  }
  #bubble .tailIn{
    bottom:-25px; margin-left:-18px;
    border-width:26px 18px 0 18px;
    border-color:#fffdf6 transparent transparent transparent;
  }
  #bubble.tailUp .tail{
    bottom:auto; top:-36px;
    border-width:0 27px 36px 27px;
    border-color:transparent transparent var(--gold) transparent;
  }
  #bubble.tailUp .tailIn{
    bottom:auto; top:-25px;
    border-width:0 18px 26px 18px;
    border-color:transparent transparent #fffdf6 transparent;
  }

  /* ---------- fx ---------- */
  #fx{ position:absolute; inset:0; z-index:60; pointer-events:none; }
  #flash{ position:absolute; inset:0; z-index:70; background:#fff; opacity:0; pointer-events:none; }
</style>

<div id="backdrop"></div>

<div id="rotate" role="alertdialog" aria-live="polite">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <rect x="30" y="6" width="40" height="88" rx="9" fill="none" stroke="#fff" stroke-width="6"/>
    <rect x="38" y="18" width="24" height="58" rx="3" fill="#fff" opacity=".85"/>
    <circle cx="50" cy="86" r="4" fill="#fff"/>
  </svg>
  <p>Turn your device sideways to play!</p>
</div>

<!-- Ogg/Opus + WebP: Chrome, Edge, Firefox, and Safari 15+ (macOS 11+/iOS 15+). -->
<audio id="bgm" loop preload="none" src="sounds/bg%20music.ogg"></audio>

<div id="stage">

  <!-- GAME -->
  <div class="layer" id="gameScreen">
    <img class="bg" id="gameBg" alt="">
    <img id="sitBird" alt="">
    <img id="stoneImg" alt="">
    <div id="balance">
      <div class="part" id="pTrayL"><img alt=""></div>
      <div class="part" id="pTrayR"><img alt=""></div>
      <div class="part" id="pBase"><img alt=""></div>
      <div class="part" id="pCol"><img alt=""></div>
      <div class="part" id="pBeam"><img alt=""></div>
      <div id="hammer">
        <svg viewBox="0 0 150 200">
          <rect x="64" y="6" width="22" height="138" rx="11" fill="#C9873F" stroke="#7A4A1E" stroke-width="7"/>
          <rect x="70" y="20" width="7" height="104" rx="4" fill="#E6B57B" opacity=".7"/>
          <rect x="12" y="126" width="126" height="64" rx="20" fill="#E2A65B" stroke="#7A4A1E" stroke-width="8"/>
          <rect x="30" y="140" width="44" height="17" rx="9" fill="#F8DDB4" opacity=".8"/>
          <circle cx="119" cy="158" r="7" fill="#7A4A1E" opacity=".35"/>
        </svg>
      </div>
    </div>
    <img id="tableImg" alt="">
    <img id="melonImg" class="thing" alt="">
    <img id="appleImg" class="thing" alt="">
    <img id="featherImg" class="thing" alt="">
    <img id="bookImg" class="thing" alt="">
    <img id="pencilImg" class="thing" alt="">
    <img id="footballImg" class="thing" alt="">
    <img id="gballImg" class="thing" alt="">
    <img id="busImg" class="thing" alt="">
    <img id="bikeImg" class="thing" alt="">
    <img id="laptopImg" class="thing" alt="">
    <img id="mobileImg" class="thing" alt="">
    <img id="elephImg" class="thing" alt="">
    <img id="dogImg" class="thing" alt="">
    <img id="lunchImg" class="thing" alt="">
    <img id="eraserImg" class="thing" alt="">

    <div id="qbar"><img alt=""><div id="qbarText"></div></div>

    <div class="dirArrow" id="arrowDown">
      <svg viewBox="0 0 104 196">
        <defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFA733"/><stop offset="1" stop-color="#FF2D55"/></linearGradient></defs>
        <path d="M36 10 H68 V104 H95 L52 184 L9 104 H36 Z"
              fill="url(#gd)" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="dirArrow" id="arrowUp">
      <svg viewBox="0 0 104 196">
        <defs><linearGradient id="gu" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#3AC6FF"/><stop offset="1" stop-color="#7B5CFF"/></linearGradient></defs>
        <path d="M36 186 H68 V92 H95 L52 12 L9 92 H36 Z"
              fill="url(#gu)" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
      </svg>
    </div>

    <div id="hand">
      <img id="handImg" alt="">
    </div>

    <button id="againBtn" hidden>Play Again</button>
    <button id="sndBtn" hidden>&#128266;&nbsp; Tap for sound</button>

    <div id="gate">
      <div class="gateBack" id="gbL"></div><div class="gateBack" id="gbR"></div>
      <img id="gateL" alt=""><img id="gateR" alt="">
    </div>

    <div id="shadow"></div>
    <div id="birdWrap"><div id="birdB" class="birdLayer"></div><div id="birdA" class="birdLayer"></div></div>
    <div id="bubble">
      <div id="bubbleText"></div>
      <div class="tail"></div><div class="tailIn"></div>
    </div>
  </div>

  <!-- START -->
  <div class="layer" id="startScreen">
    <img class="bg" id="startBg" alt="">
    <div id="tapHint" hidden>TAP TO PLAY</div>
    <button id="startBtn" aria-label="Start game" hidden><img id="startBtnImg" alt=""></button>
    <div id="preBar"><div id="preTrack"><div id="preFill"></div></div><div id="preTxt">LOADING 0%</div></div>
  </div>

  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="flash"></div>

</div>

<script>
(() => {
'use strict';

/* =========================================================
   TUNABLE LAYOUT  (stage is 1920 x 1080 — matches the artwork 1:1)
   Derived from your Figma coords, frame origin X0 = -739.5, Y0 = -2000
   (start-screen frame on top, game frame directly below it).
     button  Figma 1562,-1280  ->  822,720   (275 x 294, dead centre)
     bird    Figma 1536,-315   ->  797,605   (345 x 316)
   ========================================================= */
const LAYOUT = {
  startBtn : { x:822, y:720, w:275, h:294 },        // play button
  bird     : { footX:969, footY:921 }               // where her feet land (size = BIRD_H)
};

/* =========================================================
   THE BALANCE
   Your Figma numbers, mapped with frame origin X0 = 863.5, Y0 = 273.
   The check that says this is right: the beam's hub lands on x 969.3 and
   the column's centre on x 968.5 — 0.8px apart.
   The `f*` values are anchor points measured off the actual artwork, as a
   fraction of each part's box, so the pieces genuinely hinge together.
   ========================================================= */
const BAL = {
  beam : { x:483.5, y:401, w:930, h:229 },
  col  : { x:869.5, y:582, w:198, h:296 },
  base : { x:796.5, y:833, w:335, h:176 },
  tray : { w:314, h:418 },
  hub  : {fx:0.5224, fy:0.4926},   // beam pivot
  knobL: {fx:0.0635, fy:0.5419},   // where the left pan hooks on
  knobR: {fx:0.9414, fy:0.5394},   // where the right pan hooks on
  ring  :{fx:0.4785, fy:0.1102},   // the pan's own hanging ring

  /* The part positions above are final. Everything is grouped under #balance
     and moved as ONE object from here — nudge or resize the whole balance
     with these three numbers, no part-by-part editing. Anchored on the hub. */
  group: { dx:0, dy:0, scale:1 }
};

/* ---- scene 3: the bird demonstrates the balance ----
   Same frame origin (X0 863.5). Two independent checks say this is right:
   the stone's in-pan spot lands on the left pan's LEVEL position to 0.1px,
   and the group height you gave (617.74) is the assembly with the beam
   tipped ~22deg — exactly the pose with the bird sitting in the right pan. */
const SC3 = {
  /* She perches on the red knob. The knob's centre is x 969.3 and it is only
     ~114px across where she can stand, so her feet are aimed at that centre
     and she is sized so her 80px foot span sits inside the red, not over it. */
  perch   : { footX:969.3, footY:468, h:185 },
  /* The sit-in-pan artwork is native 174x192, but measured against the perched
     bird its cap is 117px where hers is 98.6, and its head band 135px where
     hers is 116.8 — i.e. it is ~0.854 too big. Scaled to match, she is the
     same bird whether she is on top of the machine or down in the pan. */
  sitPan  : { dx:73.2,  dy:178,   w:148.6, h:164.0 },
  /* Seated against the bowl: the artwork is centred on the pan (dx) and its
     base rests just above the bowl floor at pan-y 404.5 (dy). The earlier
     offsets left it perched on the rim rather than down inside. */
  stonePan: { dx:48.6,  dy:255.6, w:216, h:144 },
  table   : { x:631.6, y:815, w:675, h:225 },
  stone0  : { x:852.5, y:767, w:216, h:144 },      // where it appears on the table
  slideUp : -217.1,                                 // the balance eases back and up
  TILT    : 21,                                     // how far the beam tips
  // after the slide the hub sits at y 197, so a perched bird would be cut off
  // the top of the screen. She lands on the table for the last two lines.
  stand   : { footX:1214, footY:884, h:250 }
};

/* The front rim of the pan, traced off the artwork's own highlight and fitted
   in pan-box pixels (rms 1.0px):   y = 328.0 - 0.00079*(x - 155.9)^2
   The sitting bird is cropped square at the bottom, so we clip her along this
   very curve — her lower edge then follows the bowl instead of cutting across
   it. A quadratic Bezier IS a parabola, so the match is exact, not eyeballed. */
const RIM = { a:328.0, b:-0.00079, h:155.9 };
function clipToRim(el, dx, dy, w){
  const f = x => RIM.a + RIM.b*Math.pow((x+dx)-RIM.h,2) - dy;
  const x0=-8, x2=w+8, xm=(x0+x2)/2;
  const y0=f(x0), y2=f(x2), y1=2*f(xm)-0.5*(y0+y2);
  el.style.clipPath =
    `path('M ${x0} -8 L ${x2} -8 L ${x2} ${y2.toFixed(1)} Q ${xm} ${y1.toFixed(1)} ${x0} ${y0.toFixed(1)} Z')`;
}
const clipBirdToRim = ()=> clipToRim(sitBird, SC3.sitPan.dx, SC3.sitPan.dy, SC3.sitPan.w);

/* =========================================================
   SCENE 4 — the gate wipe, the question bar, and the fruit round
   The gate art is 1086x1448 with a little transparent margin, so each half
   is drawn at 979x1190: that makes the PAINTED part exactly 960x1080, and
   the two halves meet on x=960 with their clasps interlocking.
   ========================================================= */
const GATE = { w:979, h:1190, top:-52.6,
               closedL:-13.5, closedR:954.6,     // painted edges meet at x=960

/* smooth interpolation across a list of keyframe values */
function liftAt(keys, p){
  const n = keys.length-1;
  const x = clamp(p,0,1)*n;
  const i = Math.min(n-1, Math.floor(x));
  const f = x-i;
  return lerp(keys[i], keys[i+1], f*f*(3-2*f));   // smoothstep between keys
}

/* ================= responsive scale =================
   The game is a fixed 16:9 box (1920 x 1080). It is only ever scaled
   uniformly to fit inside the window, so the aspect ratio is exact:
   nothing is ever cropped or stretched. Whatever space is left over
   is filled with a blurred copy of the current background.
   ==================================================== */
const backdrop = $('backdrop');

function vp(){
  const v = window.visualViewport;
  return { w: (v?v.width:innerWidth), h: (v?v.height:innerHeight) };
}
const rotateEl = $('rotate');
function fit(){
  const {w,h} = vp();
  const k = Math.min(w/1920, h/1080);         // contain — true 16:9, no crop
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
  // 48px dialogue at k<0.46 renders under ~22px — too small for a young
  // reader. Only prompt in portrait, where turning the device actually helps.
  rotateEl.classList.toggle('show', h > w && k < 0.46);
}
addEventListener('resize', fit);

/* =========================================================
   PACE — one dial for how fast the whole game moves.
   1 = the old speed. Higher = slower and gentler, for young kids.
   It scales every wait, every tween, every WAAPI animation and every
   cross-fade, so all the timing stays in step with itself.
   ========================================================= */
const PACE = 1.5;
(function(){                       // every .animate() call slows with it
  const orig = Element.prototype.animate;
  Element.prototype.animate = function(kf, opts){
    if(typeof opts === 'number') return orig.call(this, kf, opts*PACE);
    if(opts && typeof opts.duration === 'number')
      return orig.call(this, kf, Object.assign({}, opts, {duration:opts.duration*PACE}));
    return orig.call(this, kf, opts);
  };
})();
const later = (fn, ms) => setTimeout(fn, ms*PACE);

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp =(a,b,t)=>a+(b-a)*t;

const easeOutCubic = t => 1-Math.pow(1-t,3);
const easeInOutCubic = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOutBack = t => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };
const wait = ms => new Promise(r=>setTimeout(r, ms*PACE));

   AUDIO  — everything is synthesised, no sound files needed
   ========================================================= */
let actx=null, master=null;
function audioOn(){
  if(!actx){
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    try{ actx = new AC(); }catch(_){ return; }
    master = actx.createGain(); master.gain.value=.9; master.connect(actx.destination);
  }
  if(actx.state !== 'running'){
    try{ actx.resume(); }catch(_){}
    /* resume() alone does not unlock Safari — it wants a sound actually
       STARTED inside the gesture, so kick a one-sample silent buffer. */
    try{
      const src = actx.createBufferSource();
      src.buffer = actx.createBuffer(1, 1, actx.sampleRate);
      src.connect(master); src.start(0);
    }catch(_){}
  }
}
/* resume() is asynchronous. Anything scheduled at exactly currentTime while
   the context is still waking up lands in the past and is dropped, which is
   why the first effects went missing. A small lookahead fixes that. */
const LOOKAHEAD = 0.025;
const aNow = (t=0)=> actx.currentTime + t + LOOKAHEAD;
function tone({f=440,f2=null,t=0,d=.25,type='sine',v=.25,curve='exp'}){
  if(!actx || !master) return;
  const now=aNow(t);
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,now);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(1,f2), now+d);
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(v, now+Math.min(.03,d*.25));
  if(curve==='exp') g.gain.exponentialRampToValueAtTime(.0001, now+d);
  else g.gain.linearRampToValueAtTime(0, now+d);
  o.connect(g); g.connect(master); o.start(now); o.stop(now+d+.05);
}
function noise({t=0,d=.4,v=.2,f0=400,f1=2600,q=1.1}){
  if(!actx || !master) return;
  const now=aNow(t);
  const len=Math.ceil(actx.sampleRate*(d+.05));
  const buf=actx.createBuffer(1,len,actx.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1);
  const s=actx.createBufferSource(); s.buffer=buf;
  const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q;
  bp.frequency.setValueAtTime(f0,now); bp.frequency.exponentialRampToValueAtTime(f1,now+d);
  const g=actx.createGain();
  g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(v,now+.05);
  g.gain.exponentialRampToValueAtTime(.0001, now+d);
  s.connect(bp); bp.connect(g); g.connect(master); s.start(now); s.stop(now+d+.05);
}

    noise({d:.13,v:.34,f0:1400,f1:200,q:1.1});

  },
  creak(){                           // the beam swinging on its pivot
    if(!actx || !master) return;
    const now=aNow(), o=actx.createOscillator(), g=actx.createGain(),
          lfo=actx.createOscillator(), lg=actx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(150,now);
    o.frequency.exponentialRampToValueAtTime(96,now+.72);
    lfo.frequency.value=13; lg.gain.value=26; lfo.connect(lg); lg.connect(o.frequency);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=5.5; bp.frequency.value=560;
    g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.10,now+.10);
    g.gain.exponentialRampToValueAtTime(.0001,now+.78);
    o.connect(bp); bp.connect(g); g.connect(master);
    o.start(now); lfo.start(now); o.stop(now+.82); lfo.stop(now+.82);
  },
  whee(){ tone({f:520,f2:1320,d:.42,type:'triangle',v:.18}); tone({f:780,f2:1980,d:.36,type:'sine',v:.09,t:.04}); },
  tada(){
    [[523,0],[659,.11],[784,.22],[1047,.33],[1319,.33],[1568,.46]].forEach(([f,t])=>

    [0,.11,.22,.33].forEach((t,i)=>tone({f:[131,165,196,262][i],d:.7,type:'triangle',v:.09,t}));
    noise({t:.33,d:.7,v:.10,f0:900,f1:5200,q:.5});
  },
  confettiPop(){                     // a party popper going off
    noise({d:.12,v:.40,f0:4200,f1:700,q:.8});
    tone({f:190,f2:1300,d:.12,type:'square',v:.17});
    tone({f:900,f2:2500,d:.26,type:'triangle',v:.13,t:.02});
    noise({t:.10,d:.75,v:.10,f0:2200,f1:5400,q:.5});   // paper fluttering down
  },
  cheer(){                           // a room full of happy children
    if(!actx || !master) return;
    const now=aNow(), dur=2.0;
    const len=Math.ceil(actx.sampleRate*dur);
    const buf=actx.createBuffer(1,len,actx.sampleRate), ch=buf.getChannelData(0);

    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(now); src.stop(now+dur+.05);
    // bright whoops riding on top
    [0,.13,.27,.44,.62].forEach((t,i)=>

            d:.75, type:'triangle', v:.09, t}));

/* =========================================================
   BACKGROUND MUSIC
   A plain <audio> element rather than Web Audio, so it plays even where the
   Web Audio graph is blocked. It sits at 30% and ducks right down whenever
   the bird is speaking, so her words always sit on top of it.
   ========================================================= */
const BGM_ON = 0.30, BGM_DUCK = 0.07;
const bgm = $('bgm');
bgm.volume = 0;
let bgmRaf=null, bgmStarted=false;

function fadeBgm(to, ms){
  if(bgmRaf) cancelAnimationFrame(bgmRaf);
  const from = bgm.volume, t0 = performance.now();
  (function step(now){
    const k = clamp((now-t0)/ms, 0, 1);
    bgm.volume = clamp(lerp(from, to, k), 0, 1);
    if(k<1) bgmRaf = requestAnimationFrame(step); else bgmRaf = null;
  })(t0);
}
function startMusic(){
  if(bgmStarted) return;
  bgmStarted = true;
  bgm.volume = 0;
  const pr = bgm.play();
  if(pr && pr.catch) pr.catch(()=>{ bgmStarted = false; });   // let a later tap retry
  fadeBgm(BGM_ON, 1200);
}
const duckMusic   = ()=> fadeBgm(BGM_DUCK, 240);
const unduckMusic = ()=> fadeBgm(BGM_ON,   900);

/* =========================================================
   RECORDED SOUND EFFECTS
   Played through <audio> like the music, so they work even where the
   synthesised Web Audio effects are blocked. Each name keeps a small pool of
   elements so two can overlap — the round's two objects appear 180ms apart.
   ========================================================= */
const SFX_FILES = {          // Ogg/Opus — see the note beside <audio id="bgm">
  appear : 'sounds/things appear sound.ogg'
};
const sfxPool = {};
function makeClip(name){
  const path = SFX_FILES[name];
  const a = new Audio(srcFor(path));
  // a blob is already in memory so 'auto' costs nothing; without one we must
  // not let the element download behind the preloader's back
  a.preload = blobFor[path] ? 'auto' : 'none';
  withBlobFallback(a, path);
  return a;
}
function sfxPlay(name, vol=0.9){
  if(!SFX_FILES[name]) return;
  let pool = sfxPool[name] || (sfxPool[name] = []);
  let a = pool.find(x => x.paused || x.ended);
  if(!a){
    if(pool.length >= 4) a = pool[0];            // reuse the oldest
    else { a = makeClip(name); pool.push(a); }
  }
  a.volume = clamp(vol, 0, 1);
  try{ a.currentTime = 0; }catch(_){}
  const pr = a.play();
  if(pr && pr.catch) pr.catch(()=>{});
}

/* ---- voice ---- */
/* Speech is a nicety, never a dependency. Every entry point below is wrapped,
   because `window.speechSynthesis` can exist and still throw on access in
   locked-down browsers and some embedded webviews — and an uncaught throw here
   runs at module scope, which would kill the whole game before it renders. */
let voice=null, speechBroken=false, speechMute=false, speechEverFired=false;
function synth(){
  if(speechBroken) return null;
  try{
    const s = window.speechSynthesis;
    if(!s || typeof s.speak !== 'function') { speechBroken = true; return null; }
    return s;
  }catch(_){ speechBroken = true; return null; }
}
function pickVoice(){
  const sp = synth(); if(!sp) return null;
  let vs = [];
  try{ vs = sp.getVoices?.() || []; }catch(_){ speechBroken = true; return null; }
  if(!vs.length) return null;
  if(!vs.length) return null;
  const want=['samantha','karen','tessa','moira','victoria','google uk english female','google us english','zira','fiona','nicky','allison','ava'];
  for(const w of want){ const v=vs.find(v=>v.name.toLowerCase().includes(w)); if(v) return v; }
  return vs.find(v=>/en(-|_)/i.test(v.lang)) || vs[0];
}
try{
  const sp = synth();
  if(sp){
    voice = pickVoice();
    sp.onvoiceschanged = ()=>{ try{ voice = pickVoice(); }catch(_){} };
  }
}catch(_){ speechBroken = true; }
/* onWord(charIndex, charLength) fires as each word is actually spoken, so the
   text on screen can appear in step with the voice rather than on a guess. */
/* Browsers only let the speech engine start from a user gesture, and some
   won't hand over the voice list until they feel like it. This runs inside
   the very first tap and gets both out of the way. */
let speechArmed=false, curUtter=null;
function warmUpSpeech(){
  const sp = synth(); if(!sp) return;
  try{
    sp.getVoices();
    const u=new SpeechSynthesisUtterance(' ');
    u.volume=0; u.rate=1;
    curUtter=u;
    sp.speak(u);                   // unlocks the engine while the tap is live
    speechArmed=true;
  }catch(_){ speechBroken = true; }
}
function voicesReady(){
  return new Promise(res=>{
    const sp = synth();
    if(!sp) return res();                       // no engine: carry on regardless
    try{
      if((sp.getVoices()||[]).length) return res();
      let n=0;
      const t=setInterval(()=>{
        let has=0;
        try{ has=(sp.getVoices()||[]).length; }catch(_){ speechBroken=true; clearInterval(t); return res(); }
        if(has || ++n>25){ clearInterval(t); res(); }
      }, 100);
      sp.addEventListener('voiceschanged', ()=>{ clearInterval(t); res(); }, {once:true});
    }catch(_){ speechBroken = true; res(); }    // never leave this promise pending
  });
}
/* if the browser suspends things, bring audio back on the next interaction */
function nudgeAudio(){
  audioOn();
  if(bgmStarted && bgm.paused){ const pr=bgm.play(); if(pr&&pr.catch) pr.catch(()=>{}); }
  try{ const sp=synth(); if(sp && sp.paused) sp.resume(); }catch(_){}
}
['pointerdown','keydown','touchstart'].forEach(ev=>
  window.addEventListener(ev, nudgeAudio, {passive:true}));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) nudgeAudio(); });

async function speak(text, onWord){
  const est = 900 + text.length*95;

  // No engine, a broken one, or one we have already learned is silent: go
  // straight to the timed path rather than arming a long safety net per line.
  if(speechMute || !synth()) return wait(est/PACE);

  if(!speechArmed) warmUpSpeech();
  await voicesReady();
  if(speechBroken) return wait(est/PACE);
  if(!voice) voice=pickVoice();

  return new Promise(res=>{
    let done=false, heard=false;
    const finish=()=>{ if(done)return; done=true; res(); };
    const alive=()=>{ heard=true; speechEverFired=true; };
    const sp = synth();
    if(!sp){ finish(); return; }
    try{
      if(sp.speaking || sp.pending) sp.cancel();
      if(sp.paused) sp.resume();
      const u=new SpeechSynthesisUtterance(text);
      curUtter=u;                    // hold a reference: some engines drop it otherwise
      if(voice) u.voice=voice;
      u.lang = (voice && voice.lang) || 'en-US';
      u.rate=.66; u.pitch=1.5; u.volume=1;   // slow and clear for young ears
      u.onstart = alive;
      if(onWord) u.onboundary = e=>{
        alive();
        if(e.name && e.name!=='word') return;
        if(typeof e.charIndex === 'number') onWord(e.charIndex, e.charLength);
      };
      u.onend=()=>{ alive(); finish(); };
      u.onerror=finish;
      sp.speak(u);
      // Until an utterance has ever reported back, keep the net short — a
      // silent engine would otherwise make every single line wait it out.
      const net = speechEverFired ? est+6000 : Math.min(est, 2200);
      setTimeout(()=>{
        if(!heard && !speechEverFired) speechMute = true;   // learn it once
        finish();
      }, net);
    }catch(e){ speechBroken = true; setTimeout(finish, est); }
  });
}

/* =========================================================
   PARTICLE FX
   ========================================================= */
const P=[];
const Ppush = o => { P.push(o); fxWake(); };   // any spawn wakes the parked loop
function spawnStar(x,y,opt={}){
  Ppush({k:'star',x,y,
    vx:rand(-1.9,1.9), vy:rand(-3.4,-.6), g:opt.g??.012,

    hue:opt.hue ?? [48,52,340,190,120][ (Math.random()*5)|0 ]});
}
function spawnDust(x,y){
  Ppush({k:'dust',x,y,vx:rand(-4.2,4.2),vy:rand(-2.6,-.4),g:.14,life:0,max:rand(26,44),sz:rand(6,17)});
}
function burst(x,y,n=34,spread=1){
  for(let i=0;i<n;i++){
    const a=rand(0,6.283), s=rand(1.4,7.4)*spread;
    Ppush({k:'star',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.4,g:.05,
            life:0,max:rand(40,88),sz:rand(10,26),rot:rand(0,6.28),vr:rand(-.16,.16),
            hue:[48,52,340,190,120,25][(Math.random()*6)|0]});

}
function ringWave(x,y,color='#fff'){ Ppush({k:'ring',x,y,life:0,max:34,color}); }

/* paper confetti: little rectangles that tumble and flutter as they fall */
const CONFETTI_COLS = ['#FF4D6D','#FFC53D','#4CC9F0','#7BE495','#B892FF','#FF9F1C','#FF6FA5'];

    spawnConfetti(rand(-60,1980), rand(-320,-20), rand(-2.6,2.6), rand(1,5));

/* fat cartoon poof-clouds — several blobs per puff so they read as clouds */
function spawnCloud(x,y,opt={}){

  for(let i=0;i<n;i++) blobs.push([rand(-.7,.7), rand(-.55,.45), rand(.5,1.0)]);
  Ppush({k:'cloud',x,y,vx:opt.vx??rand(-1.4,1.4),vy:opt.vy??rand(-1.5,-.2),g:-.008,
          life:0,max:rand(34,58),sz:opt.sz??rand(26,46),blobs});
}
function cloudBurst(x,y,n=10,spread=1){
  for(let i=0;i<n;i++){
    const a=rand(-Math.PI,0), sp=rand(1.6,5.4)*spread;
    spawnCloud(x+rand(-24,24), y+rand(-12,12),
               {vx:Math.cos(a)*sp*1.5, vy:Math.sin(a)*sp*.55, sz:rand(24,52)});

function drawStar(c,x,y,r,rot,color,alpha){
  c.save(); c.translate(x,y); c.rotate(rot); c.globalAlpha=alpha;
  c.fillStyle=color; c.shadowColor=color; c.shadowBlur=r*1.5;
  c.beginPath();
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2;
    c.quadraticCurveTo(Math.cos(a+.785)*r*.24, Math.sin(a+.785)*r*.24,
                       Math.cos(a+1.571)*r,    Math.sin(a+1.571)*r);
  }
  c.closePath(); c.fill(); c.restore();
}

let idleSparkle=false, idleT=0;
function setIdleSparkle(v){ idleSparkle=v; if(v) fxWake(); }
/* The canvas used to clear and repaint 1920x1080 every frame forever, even
   with nothing on it. It now parks when the particle list is empty and no idle
   sparkles are due, and any spawn wakes it again. */
let fxRaf=null, fxDirty=false;
function fxWake(){ if(!fxRaf) fxRaf = requestAnimationFrame(fxLoop); }
function fxLoop(){
  fxRaf = null;
  if(!P.length && !idleSparkle){
    if(fxDirty){ fctx.clearRect(0,0,1920,1080); fxDirty=false; }
    return;                                   // nothing to draw: stop asking for frames
  }
  fctx.clearRect(0,0,1920,1080);
  fxDirty = true;
  if(idleSparkle && ++idleT%9===0) spawnStar(rand(60,1860), rand(80,1030), {g:-.004});
  for(let i=P.length-1;i>=0;i--){
    const p=P[i]; p.life++;
    if(p.life>p.max){ P.splice(i,1); continue; }
    const t=p.life/p.max;
    if(p.k==='conf'){
      p.vy = Math.min(p.vy + p.g, 11);
      p.x += p.vx + Math.sin(p.life*p.sway + p.phase)*1.9;
      p.y += p.vy;
      p.rot += p.vr;
      const flat = Math.abs(Math.cos(p.life*p.sway*1.8 + p.phase));  // it flips edge-on
      fctx.save();
      fctx.globalAlpha = t>.85 ? (1-t)/.15 : 1;
      fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.fillStyle = p.col;
      fctx.fillRect(-p.w/2, -p.h*flat/2, p.w, p.h*flat);
      fctx.restore();
      if(p.y > 1160) P.splice(i,1);
      continue;
    }
    if(p.k==='ring'){
      const r=lerp(20,340,easeOutCubic(t));
      fctx.save(); fctx.globalAlpha=(1-t)*.75; fctx.strokeStyle=p.color;
      fctx.lineWidth=lerp(22,1,t); fctx.beginPath(); fctx.arc(p.x,p.y,r,0,6.283); fctx.stroke(); fctx.restore();
      continue;
    }
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.985; p.vy*=.985;
    if(p.k==='cloud'){
      const r=p.sz*(.55+easeOutCubic(t)*1.35);
      fctx.save(); fctx.globalAlpha=(1-t)*(1-t)*.9; fctx.fillStyle='#ffffff';
      for(const o of p.blobs){
        fctx.beginPath(); fctx.arc(p.x+o[0]*r, p.y+o[1]*r, r*o[2], 0, 6.283); fctx.fill();
      }
      fctx.restore();
      continue;
    }
    if(p.k==='dust'){
      fctx.save(); fctx.globalAlpha=(1-t)*.55; fctx.fillStyle='#D9B47C';
      fctx.beginPath(); fctx.arc(p.x,p.y,p.sz*(1+t*.9),0,6.283); fctx.fill(); fctx.restore();
    }else{
      p.rot+=p.vr;
      const tw = .55+.45*Math.sin(p.life*.35);
      const s  = p.sz * (t<.18 ? easeOutBack(t/.18) : 1-(t-.18)/.82*.55) * tw;
      drawStar(fctx,p.x,p.y,Math.max(0,s),p.rot,`hsl(${p.hue} 100% ${p.hue===48||p.hue===52?68:72}%)`, (1-t)*.95);
    }
  }
  fxWake();
}
fxWake();

/* =========================================================
   SPRITE SHEET RENDERER
   Each frame is positioned by the bird's FEET, so the artwork lines up
   perfectly across all three sheets: same height, same spot on the ground.
   Two stacked layers let one sheet cross-fade into the next instead of
   cutting hard.
   ========================================================= */
function prepSheet(cfg, img){
  cfg.img = img;
  cfg.fw = img.naturalWidth  / cfg.cols;
  cfg.fh = img.naturalHeight / cfg.rows;
  // If the artwork was swapped for a different-sized file the baked-in
  // measurements no longer apply — fall back to something sane.
  if(img.naturalWidth !== cfg.w || img.naturalHeight !== cfg.h){
    console.warn('sheet changed size, using fallback anchors:', cfg.src);
    cfg.ref = cfg.fh*0.85;
    cfg.refBottom = cfg.fh*0.93;
    cfg.anchors = Array.from({length:cfg.frames}, ()=>[cfg.fw*0.5, cfg.fh*0.93]);
    cfg.inset = 2;
  }
}

/* Draw sheet `s` frame `i` into layer `el`, anchored on the feet.
   The artwork in these sheets runs right up to the cell edges — on the jump
   sheet one bird's feet and the next one's cap are adjacent pixels — so when
   the browser resamples, a sliver of the neighbouring frame shows through.
   `inset` trims a few source pixels off every edge to make that impossible,
   and the window is positioned in exact pixels rather than percentages
   (which also handles the talk sheet's fractional 341.33px frame cleanly). */
function paint(el, s, i, H){
  const k  = (H||BIRD_H) / s.ref;
  const e  = s.inset || 0;
  const a  = s.anchors[i] || s.anchors[0];
  const ax = (a[0]-e)*k;                               // feet x inside the layer
  const ay = ((s.yPerFrame ? a[1] : s.refBottom)-e)*k;  // feet y inside the layer
  const col=i%s.cols, row=(i/s.cols)|0;
  el.style.width  = ((s.fw-2*e)*k)+'px';
  el.style.height = ((s.fh-2*e)*k)+'px';
  el.style.left   = (-ax)+'px';
  el.style.top    = (-ay)+'px';
  el.style.transformOrigin = ax+'px '+ay+'px';
  el.style.backgroundSize     = (s.img.naturalWidth*k)+'px '+(s.img.naturalHeight*k)+'px';
  el.style.backgroundPosition = (-(col*s.fw + e)*k)+'px '+(-(row*s.fh + e)*k)+'px';
}

/* ================= bird ================= */
const bird = {
  cur:null, frame:0, playing:false, raf:null, acc:0, last:0, loop:true, onDone:null,
  x:0, y:0, scale:1, rot:0, sqX:1, sqY:1, groundGap:0, h:BIRD_H,

  /* switch sheets with a cross-fade so there is no visible cut */
  swap(name, {loop=true, onDone=null, frame=0, fade=170, height=null}={}){
    const s = SHEETS[name], prev = this.cur, prevFrame = this.frame, prevH = this.h;
    fade *= PACE;
    if(height) this.h = height;
    const crossing = prev && prev!==s && fade>0;

    if(crossing){                       // park the outgoing pose on the back layer
      layerOn(birdB, 'opacity, transform');
      birdB.style.transition='none';
      birdB.style.backgroundImage=`url("${srcFor(prev.src)}")`;
      paint(birdB, prev, prevFrame, prevH);
      birdB.style.opacity='1';
      void birdB.offsetWidth;
      birdB.style.transition=`opacity ${fade}ms ease-in-out`;
      birdB.style.opacity='0';
    }

    this.cur=s; this.loop=loop; this.onDone=onDone; this.acc=0;
    birdA.style.transition='none';
    birdA.style.backgroundImage=`url("${srcFor(s.src)}")`;
    this.setFrame(frame);
    if(crossing){
      birdA.style.opacity='0';
      void birdA.offsetWidth;
      birdA.style.transition=`opacity ${fade}ms ease-in-out`;
      birdA.style.opacity='1';
    }else{
      birdA.style.opacity='1';
    }
    if(crossing) later(()=>layerOff(birdB), fade/PACE + 60);
    this.syncEl();
  },

  setFrame(i){ if(!this.cur) return; this.frame=i; paint(birdA, this.cur, i, this.h); },

  play(){ if(this.playing) return; this.playing=true; this.last=performance.now(); this.raf=requestAnimationFrame(bird.tick); },
  stop(){ this.playing=false; if(this.raf) cancelAnimationFrame(this.raf); this.raf=null; },

  tick(now){
    if(!bird.playing) return;
    const s=bird.cur;
    bird.acc += now-bird.last; bird.last=now;
    const step=1000/s.fps;
    while(bird.acc>=step){
      bird.acc-=step;
      let n=bird.frame+1;
      if(n>=s.frames){
        if(bird.loop) n=0;
        else { bird.stop(); bird.setFrame(s.frames-1); const cb=bird.onDone; bird.onDone=null; cb&&cb(); return; }
      }
      bird.setFrame(n);
    }
    bird.raf=requestAnimationFrame(bird.tick);
  },

  at(footX,footY){ this.x=footX; this.y=footY; this.syncEl(); },

  syncEl(){
    birdWrap.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
    const t = `rotate(${this.rot}deg) scale(${this.scale*this.sqX}, ${this.scale*this.sqY})`;
    birdA.style.transform = t;
    birdB.style.transform = t;   // same transform, but each layer spins about its own feet
    const gap = this.groundGap||0;
    const sw  = 230*this.scale*clamp(1.05-gap/480,.32,1.1);
    shadowEl.style.width=sw+'px'; shadowEl.style.height=(sw*.22)+'px';
    shadowEl.style.opacity = clamp(.9-gap/520,0,.9);
    shadowEl.style.transform=`translate3d(${this.x-sw/2}px, ${LAYOUT.bird.footY-sw*.11}px, 0)`;
  }
};

/* Compositing hygiene. Every hidden sprite still held a live GPU layer via
   `will-change`, and with 16 draggables plus the gate, arrows and hand that
   is a lot of texture memory for things nobody can see — enough for a browser
   to start evicting textures and paint real content blank. Hiding with
   `visibility:hidden` AND dropping `will-change` releases the layer. */
function layerOff(el){
  if(!el) return;
  el.style.visibility = 'hidden';
  el.style.willChange = 'auto';
}
function layerOn(el, hint='transform, opacity'){
  if(!el) return;
  el.style.visibility = 'visible';
  el.style.willChange = hint;
}

/* =========================================================
   PRELOADER
   Every asset is fetched with a streaming reader so progress is byte
   accurate, weighted by the real on-disk sizes below and refined by
   Content-Length as each response arrives. Fetched bytes become blob: URLs,
   so "loaded" means the file is genuinely local — nothing re-downloads when
   the game asks for it.

   Nothing here may ever block the game: a failed, stalled or aborted
   transfer (or file://, where fetch is not allowed at all) simply counts as
   done and that element keeps its original URL.
   ========================================================= */
const ASSET_BYTES = {   // real on-disk sizes, generated from the files
  "game assets/handNudge.webp": 6552,
  "weight machine/mid part of weight machine.webp": 8614,
  "weight machine/whole weight stand.webp": 12620,
  "bird/bird sit in balanced.webp": 12934,
  "game assets/startbutton.webp": 14012,
  "weight machine/weight tray.webp": 15484,
  "weight machine/weight tray holder.webp": 17546,
  "game assets/table.webp": 23056,
  "sounds/things appear sound.ogg": 42619,
  "game assets/stone.webp": 51330,
  "game assets/background game.webp": 66020,
  "game assets/pencil.webp": 71358,
  "game assets/question bar.webp": 81960,
  "game assets/green ball.webp": 102858,
  "things/apple.webp": 108784,
  "game assets/eraser.webp": 113894,
  "game assets/football.webp": 116088,
  "game assets/transition gate.webp": 117972,
  "game assets/feather.webp": 119870,
  "game assets/book.webp": 125216,
  "game assets/toy elephant .webp": 128930,
  "game assets/toy dog.webp": 134716,
  "things/watermellon.webp": 148560,
  "game assets/lunch box.webp": 155456,
  "game assets/laptop.webp": 162270,
  "game assets/toy bus.webp": 166364,
  "game assets/toy bike.webp": 180748,
  "game assets/mobile.webp": 185990,
  "game assets/start screen.webp": 200038,
  "bird/bird happy jump .webp": 239216,
  "bird/flying bird sprite sheet.webp": 270606,
  "bird/bird talking stand sprite sheet.webp": 329302,
  "sounds/bg music.ogg": 2975868
};

const PRELOAD_CONCURRENCY = 5;
const PRELOAD_TIMEOUT_MS  = 20000;      // per transfer, then we move on
const BGM_SRC = 'sounds/bg music.ogg';

const blobFor = {};        // path -> blob: URL (absent if the fetch failed)

function preloadOrder(){
  const paths = new Set([...Object.values(A), ...Object.values(SFX_FILES), BGM_SRC]);
  // the start screen and its button decide the first paint, so they lead;
  // everything else smallest-first, which puts the 3MB music last on its own
  const lead = [A.startBg, A.startBtn];
  return [...paths].sort((a,b)=>{
    const la = lead.indexOf(a), lb = lead.indexOf(b);
    if(la>=0 || lb>=0) return (la<0?99:la) - (lb<0?99:lb);
    return (ASSET_BYTES[a]||250000) - (ASSET_BYTES[b]||250000);
  });
}

async function preloadAll(onProgress, onAsset){
  const queue  = preloadOrder();
  const weight = {};                       // best known size per path
  queue.forEach(p => weight[p] = ASSET_BYTES[p] || 250000);
  const got = {};                          // bytes received per path
  let shown = 0;                           // the bar only ever goes forwards

  const tick = ()=>{
    const total = queue.reduce((n,p)=>n+weight[p], 0);
    const done  = queue.reduce((n,p)=>n+Math.min(got[p]||0, weight[p]), 0);
    const pct   = total ? Math.min(100, done/total*100) : 100;
    if(pct > shown) shown = pct;
    onProgress(shown);
  };

  async function one(path){
    const ac = new AbortController();
    const bail = setTimeout(()=>ac.abort(), PRELOAD_TIMEOUT_MS);
    try{
      const res = await fetch(encodeURI(path), {signal:ac.signal, cache:'force-cache'});
      if(!res.ok) throw new Error(res.status);
      const len = +res.headers.get('content-length');
      if(len > 0) weight[path] = len;      // refine the estimate with the truth
      if(!res.body || !res.body.getReader){
        const b = await res.blob();
        got[path] = weight[path];
        blobFor[path] = URL.createObjectURL(b);
      }else{
        const reader = res.body.getReader();
        const parts = []; let n = 0;
        for(;;){
          const {done, value} = await reader.read();
          if(done) break;
          parts.push(value); n += value.length;
          got[path] = n; tick();
        }
        weight[path] = Math.max(weight[path], n);
        got[path] = weight[path];
        blobFor[path] = URL.createObjectURL(
          new Blob(parts, {type: res.headers.get('content-type') || ''}));
      }
      try{ onAsset && onAsset(path); }catch(_){}
    }catch(_){
      got[path] = weight[path];            // failures never hold the bar back
    }finally{
      clearTimeout(bail);
      tick();
    }
  }

  let next = 0;
  const worker = async ()=>{ while(next < queue.length) await one(queue[next++]); };
  await Promise.all(Array.from({length:Math.min(PRELOAD_CONCURRENCY, queue.length)}, worker));
  onProgress(100);
}

/* use the local copy if we got one, otherwise the original URL, and always
   leave a one-shot fallback in case the blob itself fails to decode */
function srcFor(path){ return blobFor[path] || encodeURI(path); }
/* point an element at its preloaded copy, with a one-shot revert armed */
function setImg(el, key){
  const path = A[key];
  el.src = (images[key] && images[key].src) || srcFor(path);
  withBlobFallback(el, path);
}
function withBlobFallback(el, path){
  if(!blobFor[path]) return;
  el.addEventListener('error', function once(){
    el.removeEventListener('error', once);
    el.src = encodeURI(path);
    if(el.tagName === 'AUDIO' && !el.paused) el.play().catch(()=>{});
  });
}

let images={};

  const b = LAYOUT.startBtn;

  preBar.style.width = PB_W+'px';
  preBar.style.left  = (b.x + b.w/2 - PB_W/2)+'px';   // centred on the button
  preBar.style.top   = (b.y + b.h/2 - 56)+'px';

  // ---- fetch everything, byte by byte ----
  await preloadAll(pct=>{
    const p = Math.round(pct);
    preFill.style.width = p+'%';
    preTxt.textContent  = 'LOADING '+p+'%';
  }, path=>{
    // the two lead assets paint the start screen straight away, so the bar
    // fills over the real artwork rather than an empty stage
    if(path===A.startBg){
      startBg.src = srcFor(A.startBg); withBlobFallback(startBg, A.startBg);
      setBackdrop(A.startBg);
    }
    if(path===A.startBtn){
      startBtnImg.src = srcFor(A.startBtn); withBlobFallback(startBtnImg, A.startBtn);
    }

  // decode from the local copies; a failure here still resolves so one bad

    try{ images[k] = await loadImageURL(srcFor(A[k])); }

  }));

  setImg(startBtnImg, 'startBtn');
  setImg(gameBg, 'gameBg');
  setImg(handImg, 'hand');

  // ---- audio plays from the preloaded copies too ----

  setImg(pBeam.querySelector('img'), 'beam');

  place(stoneImg, SC3.stone0.x, SC3.stone0.y, SC3.stone0.w, SC3.stone0.h);

  setImg(gateL, 'gate');  setImg(gateR, 'gate');
  setGate(0);
  setImg(qbar.querySelector('img'), 'qbar');
  place(qbar, SC4.qbar.x, SC4.qbar.y, SC4.qbar.w, SC4.qbar.h);
  Object.assign(qbarText.style, {
    left:SC4.well.x+'px', top:SC4.well.y+'px',
    width:SC4.well.w+'px', height:SC4.well.h+'px'
  });
  Object.values(THINGS).forEach(t=>{
    t.el = $(t.img);
    setImg(t.el, t.src);
    place(t.el, t.home.x, t.home.y, t.w, t.h);

/* The play button has three independent ways to appear — the preload
   finishing, boot throwing, or the watchdog below — so a stalled asset can
   never leave a child stuck watching a loading bar. */
let revealed = false;
function revealStart(){
  if(revealed) return;
  revealed = true;
  clearTimeout(readyWatch);
  preFill.style.width = '100%';
  preTxt.textContent  = 'LOADING 100%';
  preBar.hidden   = true;
  startBtn.hidden = false;
  tapHint.hidden  = false;
  assetsReady     = true;
  startBtn.animate([{transform:'scale(0)',   opacity:0},
                    {transform:'scale(1.18)',opacity:1, offset:.62},
                    {transform:'scale(1)',   opacity:1}],
                   {duration:620, easing:'cubic-bezier(.34,1.56,.64,1)'});
  sfxPlay('appear', .7);
  if(pendingStart) onStart(pendingStart);      // someone tried to start early
}
const readyWatch = setTimeout(revealStart, 45000);

/* =========================================================
   SCENE 1 → 2 transition
   ========================================================= */
let started=false, assetsReady=false, pendingStart=null;
function onStart(e){
  if(started) return;
  if(!assetsReady){ pendingStart = e || {}; return; }   // keyboard/programmatic too
  started=true;
  e && e.preventDefault();
  audioOn();
  startMusic();
  warmUpSpeech();      // must happen inside the gesture, or nothing will speak
  // if the browser still hasn't let us through, offer a way to retry
  later(()=>{
    if(!actx || actx.state !== 'running') sndBtn.hidden = false;
  }, 1400);

  const cx = LAYOUT.startBtn.x + LAYOUT.startBtn.w/2;
  const cy = LAYOUT.startBtn.y + LAYOUT.startBtn.h/2;

  SFX.pop(); SFX.magic();
  tapHint.style.transition='opacity .2s'; tapHint.style.opacity='0';
  startBtn.style.animation='none';
  // a plain press-in and back; the whole start screen fades a moment later,
  // so the button doesn't need to shrink itself away
  startBtn.animate(
    [{transform:'scale(1)'},{transform:'scale(.93)'},{transform:'scale(1)'}],
    {duration:300, easing:'ease-out', fill:'forwards'});

  burst(cx,cy,44,1.25); ringWave(cx,cy,'#FFE9A8'); 
  later(()=>ringWave(cx,cy,'#8FE3FF'),110);

  later(()=>{ SFX.whoosh(); irisIn(cx,cy); }, 300);
}
/* One guarded entry point, three ways in: tapping anywhere on the screen,
   clicking the button, and Enter/Space on the focused button. `onStart` is
   idempotent, so extra events are harmless. */
startScreen.addEventListener('pointerdown', onStart, {passive:false});
startBtn.addEventListener('click', e=>{ e.stopPropagation(); onStart(e); });
startBtn.addEventListener('keydown', e=>{
  if(e.key==='Enter' || e.key===' ' || e.key==='Spacebar'){ e.preventDefault(); onStart(e); }
});

function irisIn(cx,cy){
  const R = Math.hypot(Math.max(cx,1920-cx), Math.max(cy,1080-cy))+90;
  setBackdrop(A.gameBg);
  gameScreen.style.visibility='visible';
  gameScreen.animate(
    [{clipPath:`circle(0px at ${cx}px ${cy}px)`},{clipPath:`circle(${R}px at ${cx}px ${cy}px)`}],
    {duration:900, easing:'cubic-bezier(.62,0,.28,1)', fill:'forwards'});
  startScreen.animate(
    [{transform:'scale(1)',opacity:1},{transform:'scale(1.18)',opacity:0}],
    {duration:760, easing:'cubic-bezier(.5,0,.75,0)', fill:'forwards'});
  gameBg.animate(
    [{transform:'scale(1.12)'},{transform:'scale(1)'}],
    {duration:1500, easing:'cubic-bezier(.16,1,.3,1)', fill:'forwards'});
  later(()=>{ startScreen.remove(); scene2(); }, 620);
}

   THE BALANCE — parts fly in and get hammered together

function place(el, x, y, w, h){
  el.style.left=x+'px'; el.style.top=y+'px';
  el.style.width=w+'px'; el.style.height=h+'px';
}
/* place / resize the whole balance as a single group, pivoting on the hub */
function applyGroup(){
  const g=BAL.group;
  balanceEl.style.transformOrigin = HUB.x+'px '+HUB.y+'px';
  balanceEl.style.transform = `translate(${g.dx}px, ${g.dy}px) scale(${g.scale})`;
}
function layoutBalance(){
  place(pBeam, BAL.beam.x, BAL.beam.y, BAL.beam.w, BAL.beam.h);
  place(pCol,  BAL.col.x,  BAL.col.y,  BAL.col.w,  BAL.col.h);

  place(pTrayR, KNOB_R.x-RING.x, KNOB_R.y-RING.y, BAL.tray.w, BAL.tray.h);
  applyGroup();
}

/* tilt the beam and carry the pans around with it, so it behaves like a
   real balance rather than three pictures that happen to overlap */
const RIDERS=[];              // things sitting in a pan, carried by the beam
let curTilt=0;
const TRAY_AT={L:{x:0,y:0}, R:{x:0,y:0}};

function setTilt(deg){
  pBeam.querySelector('img').style.transform = `rotate(${deg}deg)`;
  const a=deg*Math.PI/180, c=Math.cos(a), sn=Math.sin(a);
  [['L',pTrayL,KNOB_L],['R',pTrayR,KNOB_R]].forEach(([side,el,k])=>{
    const dx=k.x-HUB.x, dy=k.y-HUB.y;
    const X = HUB.x + dx*c - dy*sn - RING.x;
    const Y = HUB.y + dx*sn + dy*c - RING.y;
    el.style.left=X+'px'; el.style.top=Y+'px';
    TRAY_AT[side].x=X; TRAY_AT[side].y=Y;
  });
  // riders live outside the group, so map them through the group transform
  RIDERS.forEach(r=>{
    const p = groupToStage(TRAY_AT[r.side].x + r.dx, TRAY_AT[r.side].y + r.dy);
    r.el.style.left = p.x+'px';
    r.el.style.top  = p.y+'px';
    r.el.style.transformOrigin = '0 0';
    r.el.style.transform = `scale(${BAL.group.scale})`;
  });
  curTilt=deg;
}
/* group-local -> screen. The group is scaled about the hub, so anything that
   lives OUTSIDE #balance but has to line up with it (the pans' riders, the
   direction arrows, the drop zones) must go through here. */
function groupToStage(x, y){
  const g=BAL.group;
  return { x: HUB.x + g.scale*(x-HUB.x) + g.dx,
           y: HUB.y + g.scale*(y-HUB.y) + g.dy };
}
function riderStage(side, dx, dy){
  return groupToStage(TRAY_AT[side].x+dx, TRAY_AT[side].y+dy);
}

/* tip the beam with a springy, slightly over-shooting settle */
function tiltTo(target, dur=1150){
  stopSway();
  const from=curTilt;
  return tween(dur,(t,p)=>{
    const k = 1 - Math.cos(p*Math.PI*2.15)*Math.exp(-4.1*p);
    setTilt(lerp(from,target,k));
  }, x=>x).then(()=>{ setTilt(target); swayBase=target; idleSway(); });
}

function tween(dur, fn, ease=easeOutCubic){
  dur *= PACE;
  return new Promise(res=>{
    const t0=performance.now();
    (function step(now){
      const p=clamp((now-t0)/dur,0,1);
      fn(ease(p), p);
      if(p<1) requestAnimationFrame(step); else res();
    })(t0);
  });
}
function shake(px=10, dur=320){
  const k=[];
  for(let i=0;i<=8;i++){
    const d=px*(1-i/8);
    k.push({transform:`translate(${(i%2?-d:d).toFixed(1)}px, ${(i%2?d*.5:-d*.5).toFixed(1)}px)`});
  }
  k.push({transform:'translate(0,0)'});
  gameScreen.animate(k,{duration:dur,easing:'ease-out'});
}

/* a wooden mallet swings down and whacks the joint */
function hammerStrike(x,y){
  return new Promise(res=>{
    // the mallet head is the bottom of the svg, so line its face up on the joint
    hammerEl.style.left = (x-75)+'px';
    hammerEl.style.top  = (y-190)+'px';
    hammerEl.style.transformOrigin = '75px 159px';   // centre of the head
    hammerEl.style.opacity='1';
    hammerEl.animate([
      {transform:'translateY(-250px) rotate(-26deg) scale(.86)', opacity:0},
      {transform:'translateY(-160px) rotate(-21deg) scale(1)',   opacity:1, offset:.26},
      {transform:'translateY(0px)    rotate(0deg)   scale(1)',   opacity:1, offset:.62},
      {transform:'translateY(-52px)  rotate(-9deg)  scale(1)',   opacity:1, offset:.78},
      {transform:'translateY(-215px) rotate(-24deg) scale(.9)',  opacity:0}
    ],{duration:620, easing:'cubic-bezier(.45,0,.5,1)'});

    setTimeout(()=>{                       // the moment of impact
      SFX.hammer(); SFX.woodKnock(.26);
      shake(11,300);
      cloudBurst(x, y, 12, 1.15);
      burst(x, y, 20, .8);
      ringWave(x, y, '#FFEFC0');
      flash.animate([{opacity:0},{opacity:.2},{opacity:0}],{duration:180});
    }, 385*PACE);
    later(()=>{ hammerEl.style.opacity='0'; res(); }, 640);
  });
}

/* a part falls into place */
async function dropIn(el, {from=-400, rot=0, dur=620, squash=true}={}){
  const img=el.querySelector('img');
  el.style.opacity='1';
  await tween(dur, t=>{
    el.style.transform =
      `translateY(${lerp(from,0,t).toFixed(1)}px) rotate(${lerp(rot,0,t).toFixed(2)}deg)`;
  }, easeOutCubic);
  el.style.transform='translateY(0) rotate(0deg)';
  if(squash){
    await tween(300, t=>{
      const k = t<.4 ? lerp(1,.86,t/.4) : lerp(.86,1,(t-.4)/.6);
      img.style.transform=`scale(${(1+(1-k)*.6).toFixed(3)}, ${k.toFixed(3)})`;
    }, x=>x);
    img.style.transform='';
  }
}

async function buildBalance(){
  // ---- 1. the wooden stand thumps down ----
  const baseCx=BAL.base.x+BAL.base.w/2, baseBottom=BAL.base.y+BAL.base.h-18;
  SFX.poof(); cloudBurst(baseCx, baseBottom, 12, 1.3);
  await wait(140);
  await dropIn(pBase, {from:-460, rot:-7, dur:600});

  cloudBurst(baseCx, baseBottom, 16, 1.5); burst(baseCx, baseBottom, 18, .9);
  await wait(200);

  // ---- 2. the column drops on, and gets hammered home ----
  const colCx=BAL.col.x+BAL.col.w/2, colJoint=BAL.col.y+BAL.col.h-34;
  await dropIn(pCol, {from:-520, rot:6, dur:560});
  SFX.woodKnock(.34); cloudBurst(colCx, colJoint, 10, 1.1);
  await wait(90);
  await hammerStrike(colCx, colJoint);
  await wait(120);

  // ---- 3. the beam lands on the hub ----
  await dropIn(pBeam, {from:-480, rot:-11, dur:600, squash:false});
  SFX.woodKnock(.30); cloudBurst(HUB.x, HUB.y+12, 10, 1.1);
  await wait(90);
  await hammerStrike(HUB.x, HUB.y+6);
  await wait(120);

  // ---- 4 & 5. the pans swing in and hook on ----
  await hookTray(pTrayL, KNOB_L, -1);
  await wait(140);
  await hookTray(pTrayR, KNOB_R, +1);

  // ---- 6. it's alive: a damped see-saw, then it settles level ----
  await wait(180);
  SFX.built();
  burst(HUB.x, HUB.y-30, 46, 1.35); ringWave(HUB.x, HUB.y-20, '#FFE9A8');

/* Put one thing back on the table, exactly as it started. The stone in
   particular has already been used once in scene 3, so its position, clip
   and z-order all have to be undone before it can be shown again. */
function resetThing(t){
  t.el.getAnimations().forEach(a=>a.cancel());
  layerOff(t.el);                      // release its GPU layer while unused
  t.el.style.pointerEvents = 'none';   // invisible things must not swallow taps
  t.el.style.opacity   = '0';
  t.el.style.clipPath  = 'none';
  t.el.style.transform = '';
  t.el.style.transformOrigin = '';
  t.el.style.zIndex    = '12';
  place(t.el, t.home.x, t.home.y, t.w, t.h);
}

/* every draggable back off-screen — not just the last round's pair, so a
   stray one can never linger half-faded behind the new round */
function hideAllThings(){ Object.values(THINGS).forEach(resetThing); }

  gateR.style.left = (lerp(GATE.openR,  GATE.closedR,  k) + nudge)+'px';

  gbR.style.left   = (lerp(GATE.bOpenR, GATE.bClosedR, k) + nudge)+'px';
}
function gateClose(){
  gateEl.style.visibility='visible';

}
function gateOpen(){

/* the whole balance eases back and up as one group */
function slideBalance(dy, dur=900){
  const from=BAL.group.dy;
  SFX.whoosh();
  return tween(dur, t=>{
    BAL.group.dy = lerp(from, dy, t);
    applyGroup();
    setTilt(curTilt);          // riders live outside the group, so re-place them
  }, easeInOutCubic);
}

/* ---------- the child drags the stone into the pan themselves ----------
   A looping hand gesture shows what to do; it stops the moment they grab it.
   Drop it near the pan and it snaps in; drop it anywhere else and it hops
   back to the table and the hint starts again. */
function toStage(e){
  const r = stage.getBoundingClientRect(), k = r.width/1920;
  return { x:(e.clientX-r.left)/k, y:(e.clientY-r.top)/k };
}
/* the index fingertip sits at (95, 6) in the 254x358 handNudge artwork, which
   is 37.4, 2.4 once it is drawn at 100x141 — so these coords are where the
   FINGER points, not where the box goes */
const setHand = (fx,fy)=>{ handEl.style.left=(fx-37.4)+'px'; handEl.style.top=(fy-2.4)+'px'; };

/* home: where it lives on the table | side: which pan | off: its seat in that
   pan | W,H: its drawn size. Resolves once the child has dropped it in. */
let cancelActiveDrag = null;
function dragToPan(el, home, side, off, W, H){
  if(cancelActiveDrag) cancelActiveDrag();    // an earlier drag must not still be listening
  return new Promise(resolve=>{
    let dragging=false, grabX=0, grabY=0, finished=false, hintToken=0;

    const at     = ()=> ({ x:parseFloat(el.style.left), y:parseFloat(el.style.top) });
    const target = ()=> riderStage(side, off.dx, off.dy);
    // the whole pan is the drop zone, generously padded — asking a child to
    // hit a point is far too fussy
    const panRect = ()=>{
      const p = groupToStage(TRAY_AT[side].x, TRAY_AT[side].y), k = BAL.group.scale;
      return { x:p.x, y:p.y, w:BAL.tray.w*k, h:BAL.tray.h*k };
    };
    let tries=0;
    function overPan(a){
      const r=panRect(), PAD=140;
      const cx=a.x+W/2, cy=a.y+H/2;
      // 1. anywhere over the pan (generously padded)
      if(cx>r.x-PAD && cx<r.x+r.w+PAD && cy>r.y-PAD && cy<r.y+r.h+PAD) return true;
      // 2. or close to the seat itself
      const t=target();
      if(Math.hypot(a.x-t.x, a.y-t.y) < Math.max(360, W*1.8)) return true;
      // 3. or simply carried nearer the pan than to where it started
      const dPan  = Math.hypot(cx-(r.x+r.w/2), cy-(r.y+r.h*0.6));
      const dHome = Math.hypot(cx-(home.x+W/2), cy-(home.y+H/2));
      if(dPan < dHome) return true;
      // 4. and never let a child get stuck: take the third honest attempt
      return (++tries >= 3) && dPan < dHome*2.2;
    }

    async function runHint(){
      const me = ++hintToken;
      while(me===hintToken && !finished){
        const a=at(), t=target();
        const ax=a.x+W/2, ay=a.y+H/2, tx=t.x+W/2, ty=t.y+H/2;
        setHand(ax, ay);                       // finger right on the object
        layerOn(handEl);
        handEl.style.opacity='1';
        SFX.tap(); ringWave(ax, ay, '#FFFFFF');
        handEl.animate([{transform:'translateY(30px) scale(.85)',opacity:0},
                        {transform:'translateY(0) scale(1)',opacity:1}],
                       {duration:280, easing:'cubic-bezier(.34,1.56,.64,1)', fill:'forwards'});
        // a couple of taps on the thing itself before setting off
        for(let n=0;n<2 && me===hintToken;n++){
          el.animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'}],
                     {duration:340, easing:'ease-in-out'});
          handEl.animate([{transform:'translateY(0)'},{transform:'translateY(-18px)'},{transform:'translateY(0)'}],
                         {duration:340, easing:'ease-in-out'});
          await wait(430);
        }
        if(me!==hintToken) break;
        await tween(950,(k)=>{
          if(me!==hintToken) return;
          setHand(lerp(ax,tx,k), lerp(ay,ty,k));
        }, easeInOutCubic);
        if(me!==hintToken) break;
        ringWave(tx, ty, '#9BE7FF');
        await wait(320); if(me!==hintToken) break;
        handEl.animate([{opacity:1},{opacity:0}],{duration:240, fill:'forwards'});
        await wait(760);
      }
      if(me===hintToken) handEl.style.opacity='0';
    }
    let pulseTimer=null;
    function pulseTarget(){          // a ring over the pan for as long as they drag
      clearInterval(pulseTimer);
      const beat=()=>{
        if(!dragging){ clearInterval(pulseTimer); pulseTimer=null; return; }
        const r=panRect();
        ringWave(r.x+r.w/2, r.y+r.h*0.72, '#9BE7FF');
      };
      beat();
      pulseTimer=setInterval(beat, 620);
    }
    function stopHint(){
      hintToken++;
      handEl.getAnimations().forEach(a=>a.cancel());
      const wasVisible = handEl.style.opacity !== '0';
      handEl.style.opacity='0';
      if(wasVisible) handEl.animate([{opacity:1},{opacity:0}],{duration:180, easing:'ease-in'});
      later(()=>{ if(handEl.style.opacity==='0') layerOff(handEl); }, 260);
    }

    function onDown(e){
      if(finished || dragging) return;
      const p=toStage(e), a=at();
      const PAD=40;                                   // generous for small fingers
      if(p.x<a.x-PAD || p.x>a.x+W+PAD || p.y<a.y-PAD || p.y>a.y+H+PAD) return;
      dragging=true; stopHint();
      grabX=p.x-a.x; grabY=p.y-a.y;
      pulseTarget();
      
      el.style.zIndex='23';
      el.classList.add('held');
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      SFX.pick();
      el.animate([{transform:'scale(1)'},{transform:'scale(1.09)'}],{duration:180, fill:'forwards'});
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging) return;
      const p=toStage(e);
      el.style.left=(p.x-grabX)+'px';
      el.style.top =(p.y-grabY)+'px';
      if(Math.random()<.10) spawnStar(p.x+rand(-46,46), p.y+rand(-34,34), {g:-.01});
      e.preventDefault();
    }
    async function onUp(){
      if(!dragging) return;
      dragging=false;
      el.animate([{transform:'scale(1.09)'},{transform:'scale(1)'}],{duration:180, fill:'forwards'});
      el.classList.remove('held');
      const a=at();
      if(overPan(a)) await snapIn(a, target());
      else await goHome(a);
    }

    function cleanup(){
      finished = true;
      stopHint(); clearInterval(pulseTimer);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      stage.removeEventListener('pointerdown', onDown);
      el.removeEventListener('pointerdown', onDown);
      el.style.cursor = 'default';
      el.style.pointerEvents = 'none';
      el.classList.remove('held');
      if(cancelActiveDrag === cleanup) cancelActiveDrag = null;
    }

    async function snapIn(from, t){
      cleanup();
      const k0 = BAL.group.scale;
      el.style.transformOrigin='0 0';
      await tween(150,(k)=>{                            // snappy: it just drops in
        el.style.left=lerp(from.x, t.x, k)+'px';
        el.style.top =lerp(from.y, t.y, k)+'px';
        el.style.transform=`scale(${lerp(1,k0,k).toFixed(4)})`;   // settles into the pan
      }, easeOutCubic);
      SFX.stoneThud(); shake(10,300);
      cloudBurst(t.x+W/2, t.y+H*0.62, 12, 1.1);
      burst(t.x+W/2, t.y+H*0.4, 18, .8);
      el.getAnimations().forEach(a=>a.cancel());
      el.style.transformOrigin='0 0';
      el.style.transform=`scale(${BAL.group.scale})`;
      el.style.zIndex='9';
      clipToRim(el, off.dx, off.dy, W);
      RIDERS.push({el, side, dx:off.dx, dy:off.dy});
      setTilt(curTilt);
      resolve();
    }
    async function goHome(from){
      SFX.tap();
      await tween(300,(k)=>{
        el.style.left=lerp(from.x, home.x, k)+'px';
        el.style.top =lerp(from.y, home.y, k)+'px';
      }, easeOutCubic);
      el.style.zIndex='12';
      runHint();
    }

    // the voice-over has finished by the time we get here, so make it obvious
    // the object is now live
    (function unlockCue(){
      const a=at();
      ringWave(a.x+W/2, a.y+H/2, '#FFE9A8');
      later(()=>ringWave(a.x+W/2, a.y+H/2, '#9BE7FF'), 200);
      burst(a.x+W/2, a.y+H/2, 14, .55);
      SFX.chirp(.18);
      el.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'},
                  {transform:'scale(1.07)'},{transform:'scale(1)'}],
                 {duration:620, easing:'ease-in-out'});
    })();

    cancelActiveDrag = cleanup;
    el.style.pointerEvents = 'auto';    // this is the one that can be picked up
    el.style.cursor = 'grab';
    el.addEventListener('pointerdown', onDown);
    stage.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    runHint();
  });
}
