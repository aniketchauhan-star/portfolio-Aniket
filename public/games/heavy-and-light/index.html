/* generic: fly the bird to a spot and land there */
function birdFlyTo(footX, footY, h, {fromX=null, fromY=-240, cx=null, cy=null, dur=1500}={}){
  return new Promise(res=>{
    const x0 = fromX!==null ? fromX : bird.x;
    const y0 = fromX!==null ? fromY : bird.y;
    const CX = cx!==null ? cx : (x0+footX)/2;
    const CY = cy!==null ? cy : Math.min(y0,footY)-260;
    birdWrap.style.opacity='1';
    bird.swap('fly',{loop:true, fade:fromX!==null?0:170, height:h});
    bird.play();
    dur *= PACE;
    const t0=performance.now(); let lastFlap=0;
    (function step(now){
      const raw=clamp((now-t0)/dur,0,1), t=easeInOutCubic(raw), mt=1-t;
      const x = mt*mt*x0 + 2*mt*t*CX + t*t*footX;
      const y = mt*mt*y0 + 2*mt*t*CY + t*t*footY + Math.sin(raw*Math.PI*4.6)*16*(1-raw);
      bird.scale=1; bird.rot = Math.sin(raw*Math.PI*4.6)*5*(1-raw);
      bird.groundGap = 900;                       // in the air: no ground shadow
      bird.at(x,y);
      if(now-lastFlap>150 && raw<.9){ lastFlap=now; SFX.flap(); }
      if(raw<1) requestAnimationFrame(step);
      else{
        bird.stop();
        bird.swap('talk',{loop:false, frame:0, fade:200, height:h});
        bird.rot=0; bird.at(footX,footY);
        SFX.woodKnock(.16);
        cloudBurst(footX, footY, 6, .7);
        res();
      }
    })(t0);
  });
}

/* a pan flies in from off-frame and hooks onto its knob */
async function hookTray(el, knob, dir){
  const img=el.querySelector('img');
  const startX = dir<0 ? -520 : 520;
  el.style.opacity='1';
  await tween(680, (t,p)=>{
    const y = -180*Math.sin(p*Math.PI)*(1-p*.4);
    el.style.transform=`translate(${lerp(startX,0,t).toFixed(1)}px, ${y.toFixed(1)}px)`;
    img.style.transform=`rotate(${lerp(dir*26,0,t).toFixed(2)}deg)`;
  }, easeOutCubic);
  el.style.transform='translate(0,0)';
  SFX.chain(); SFX.woodKnock(.18);
  cloudBurst(knob.x, knob.y+40, 8, .9);
  burst(knob.x, knob.y+10, 16, .7);
  // it keeps swinging on its hook while the build carries on
  tween(1100, (t,p)=>{
    img.style.transform=`rotate(${(Math.sin(p*Math.PI*3.4)*dir*15*(1-p)*(1-p)).toFixed(2)}deg)`;
  }, x=>x).then(()=>{ img.style.transform='rotate(0deg)'; });
  await wait(260);
}

/* the finished balance breathes very gently so it doesn't look frozen */
let swayBase=0, swayRaf=null, swayLast=null;
function idleSway(){
  if(swayRaf) return;
  const t0=performance.now();
  (function sway(now){
    const deg = swayBase + Math.sin((now-t0)/2600)*0.85;
    // setTilt writes left/top on both pans and every rider, so only do it when
    // the angle has actually moved enough to be visible
    if(swayLast===null || Math.abs(deg-swayLast) > 0.02){ setTilt(deg); swayLast=deg; }
    swayRaf=requestAnimationFrame(sway);
  })(t0);
}
function stopSway(){ if(swayRaf) cancelAnimationFrame(swayRaf); swayRaf=null; swayLast=null; }

/* =========================================================
   the bird waves goodbye and flies out of frame
   ========================================================= */
async function flyAway(){
  SFX.chirp(.26);
  // a little crouch first, so the take-off has some weight to it
  await tween(240, t=>{
    bird.sqY = 1-0.14*Math.sin(t*Math.PI);
    bird.sqX = 1+0.11*Math.sin(t*Math.PI);
    bird.syncEl();
  }, x=>x);
  bird.sqX=bird.sqY=1;

  bird.swap('fly',{loop:true, fade:170, height:bird.h});
  bird.play();
  SFX.whoosh();

  const x0=bird.x, y0=bird.y;    // she may be on the ground or up on the table
  const C={x:x0+560,y:y0-620}, P1={x:2360,y:-320};
  let lastFlap=0;
  await tween(1650, (t,p)=>{
    const mt=1-t;
    const x = mt*mt*x0 + 2*mt*t*C.x + t*t*P1.x;
    const y = mt*mt*y0 + 2*mt*t*C.y + t*t*P1.y;
    bird.scale = lerp(1,.55,t);
    bird.rot   = lerp(0,-14,t) + Math.sin(p*Math.PI*7)*4;
    bird.groundGap = Math.max(0, y0-y);
    bird.at(x,y);
    const now=performance.now();
    if(now-lastFlap>145 && p<.75){ lastFlap=now; SFX.flap(); }
    if(p<.6 && Math.random()<.22) spawnStar(x+rand(-60,60), y-rand(40,220), {g:-.01});
  }, t=>t*t*(3-2*t));

  bird.stop();
  birdWrap.style.opacity='0';
  shadowEl.style.opacity='0';
}

function flyIn(){
  return new Promise(res=>{
    bird.swap('fly',{loop:true, fade:0});
    bird.play();

    const P0={x:-360,y:340}, C={x:490,y:190}, P1={x:LAYOUT.bird.footX,y:LAYOUT.bird.footY};
    const DUR=2350*PACE, t0=performance.now();
    let lastFlap=0, lx=P0.x, ly=P0.y;

    (function step(now){
      const raw=clamp((now-t0)/DUR,0,1);
      const t=easeOutCubic(raw);
      const mt=1-t;
      let x = mt*mt*P0.x + 2*mt*t*C.x + t*t*P1.x;
      let y = mt*mt*P0.y + 2*mt*t*C.y + t*t*P1.y;
      // wing-beat bob, fading out as she settles
      y += Math.sin(raw*Math.PI*5.2)*20*(1-easeInOutCubic(raw));
      bird.scale = lerp(.72,1,easeOutCubic(clamp(raw*1.15,0,1)));
      bird.rot   = clamp((x-lx)*.9,-9,9)*(1-t*t) + Math.sin(raw*Math.PI*5.2)*3*(1-raw);
      bird.groundGap = Math.max(0, LAYOUT.bird.footY - y);
      lx=x; ly=y;
      bird.at(x,y);

      if(now-lastFlap>150 && raw<.92){ lastFlap=now; SFX.flap(); }
      if(raw<1) requestAnimationFrame(step);
      else {
        bird.stop();
        bird.setFrame(SHEETS.fly.restFrame);   // touch down wings-tucked, not mid-flap
        land(res);
      }
    })(t0);
  });
}

function land(res){
  bird.rot=0; bird.groundGap=0;
  bird.stop();
  bird.at(LAYOUT.bird.footX, LAYOUT.bird.footY);
  // dissolve out of the flap and into the neutral standing pose
  bird.swap('talk',{loop:false, frame:0, fade:220});
  SFX.land();
  for(let i=0;i<16;i++) spawnDust(LAYOUT.bird.footX+rand(-70,70), LAYOUT.bird.footY-rand(0,14));
  // squash & settle
  const t0=performance.now(), D=430*PACE;
  (function s(now){
    const t=clamp((now-t0)/D,0,1);
    // 1 → squash → overshoot → 1
    const k = t<.28 ? lerp(1,.80,easeOutCubic(t/.28))
            : t<.62 ? lerp(.80,1.09,easeOutCubic((t-.28)/.34))
            :         lerp(1.09,1,easeOutCubic((t-.62)/.38));
    bird.sqY=k; bird.sqX=1+(1-k)*.75;
    bird.syncEl();
    if(t<1) requestAnimationFrame(s);
    else { bird.sqX=bird.sqY=1; bird.syncEl(); res(); }
  })(t0);
}

function happyJump(){
  return new Promise(res=>{
    const s   = SHEETS.jump;
    const DUR = s.frames*1000/s.fps;

    bird.swap('jump',{loop:false, frame:0, fade:150, onDone:()=>{
      bird.groundGap=0;
      bird.at(LAYOUT.bird.footX, LAYOUT.bird.footY);
      bird.swap('talk',{loop:false, frame:0, fade:190});
      res();
    }});
    bird.play();
    SFX.happy();

    // this sheet has no arc drawn into it, so lift her from code
    const j0=performance.now();
    (function arc(now){
      const p    = clamp((now-j0)/DUR,0,1);
      const lift = liftAt(s.lift,p)*JUMP_H;
      bird.groundGap = lift;
      bird.at(LAYOUT.bird.footX, LAYOUT.bird.footY-lift);
      if(p<1) requestAnimationFrame(arc);
    })(j0);

    const apex = DUR*0.57;
    // sparkles at the top of the jump
    setTimeout(()=>{
      const hx=LAYOUT.bird.footX, hy=LAYOUT.bird.footY-JUMP_H-BIRD_H*0.95;
      SFX.sparkle();
      burst(hx,hy,40,1.05);
      ringWave(hx,hy,'#FFF0B0');
      for(let i=0;i<14;i++) setTimeout(()=>spawnStar(hx+rand(-140,140), hy+rand(-60,90),{g:-.02}), i*38);
      flash.animate([{opacity:0},{opacity:.34},{opacity:0}],{duration:340,easing:'ease-out'});
    }, apex);
    // little landing puff at the end
    setTimeout(()=>{
      SFX.pop();
      for(let i=0;i<10;i++) spawnDust(LAYOUT.bird.footX+rand(-55,55), LAYOUT.bird.footY-rand(0,10));
    }, DUR*0.86);
  });
}

async function talkTo(){
  const cx = LAYOUT.bird.footX, headY = LAYOUT.bird.footY - BIRD_H;
  for(const line of TEXT) await speech(line, cx, headY, 1240, 'talk');
  SFX.chirp(.2);
}

/* park the bubble above whatever the bird is standing on */
/* Size the box to the words rather than to a fixed width, so a short line
   doesn't sit in a big empty panel. `wMax` is now only a ceiling: if the line
   needs to wrap we divide it into even lines instead of running to the full
   width, which keeps the text block roughly square and the padding even.
   The box is measured with the WHOLE line and then locked, so it doesn't
   grow and reflow while the words are appearing. */
/* aimX / aimY is the point the tail must touch — her head when the bubble is
   above her, her body when it is below. The box is then placed so the tail
   lands there, instead of each line guessing its own vertical offset. */
const TAIL_H = 36, TAIL_BITE = 6;   // tail length, and how far it overlaps her
function bubbleAt(aimX, aimY, wMax=900, boxCx=null, tailUp=false, text=''){
  wMax = Math.min(wMax, 1840);

  bubble.style.width='auto'; bubble.style.height='auto'; bubble.style.maxWidth='none';
  bubbleText.textContent = text;
  bubbleText.style.whiteSpace='nowrap';
  const oneLine = bubble.offsetWidth;            // what it wants on a single line
  bubbleText.style.whiteSpace='';

  let w = oneLine;
  if(oneLine > wMax){
    const lines = Math.ceil(oneLine/wMax);       // split it into even lines
    w = Math.min(wMax, Math.ceil(oneLine/lines*1.08));
  }
  w = clamp(w, 250, wMax);
  bubble.style.width = w+'px';
  bubble.style.height = bubble.offsetHeight+'px';
  bubbleText.textContent='';

  const h = bubble.offsetHeight;
  // put the box where the tail tip reaches the aim point
  let bottomY = tailUp ? aimY + h + TAIL_H - TAIL_BITE
                       : aimY - TAIL_H + TAIL_BITE;
  bottomY = clamp(bottomY, h+16, 1070);

  const cx   = boxCx===null ? aimX : boxCx;
  const left = clamp(cx - w/2, 40, 1920-w-40);
  bubble.style.left  = left+'px';
  bubble.style.bottom= (1080-bottomY)+'px';
  bubble.classList.toggle('tailUp', !!tailUp);
  bubble.style.transformOrigin = tailUp ? '50% -20%' : '50% 120%';
  const tailPct = clamp((aimX-left)/w*100, 8, 92);
  bubble.querySelectorAll('.tail,.tailIn').forEach(t=>t.style.left=tailPct+'%');
}

/* reveal `text` into an element in step with the voice actually saying it */
async function speakInto(el, text){
  duckMusic();                     // drop the music under her voice
  el.textContent='';
  let shown=0, viaVoice=false;
  const reveal = n => {
    n=Math.min(n, text.length);
    if(n<=shown) return;
    shown=n; el.textContent=text.slice(0,n); SFX.blip();
  };
  const per = clamp(3400/text.length, 42, 92)*PACE;
  let i=0;
  const iv=setInterval(()=>{
    if(viaVoice) return;
    reveal(++i);
    if(i>=text.length) clearInterval(iv);
  }, per);
  await speak(text, (ci,cl)=>{
    viaVoice=true;
    let end = ci + (cl||0);
    if(!cl){ const m=/\S+/.exec(text.slice(ci)); end = ci + (m ? m[0].length : 1); }
    reveal(end);
  });
  clearInterval(iv);
  el.textContent=text;
  unduckMusic();                   // and bring it back up
}

/* speak a line while `anim` gives whoever is talking a bit of life */
function sayLine(text, anim='talk'){
  return new Promise(async res=>{
    let bob=null;
    if(anim==='talk'){ bird.swap('talk',{loop:true, frame:0, fade:0}); bird.play(); }
    else if(anim==='sit'){
      const t0=performance.now();
      (function b(now){
        const k=1+Math.sin((now-t0)/150)*0.022;
        sitBird.style.transform=`scale(${(2-k).toFixed(3)}, ${k.toFixed(3)})`;
        bob=requestAnimationFrame(b);
      })(t0);
    }
    const chirps=setInterval(()=>SFX.chirp(.07), 720);
    await speakInto(bubbleText, text);
    clearInterval(chirps);
    if(anim==='talk'){ bird.stop(); bird.setFrame(0); }
    if(bob){ cancelAnimationFrame(bob); sitBird.style.transform=''; }
    res();
  });
}

/* gentle breathing when she's just standing there */
let idleRaf=null, idleTimer=null;
function stopIdle(){
  if(idleRaf) cancelAnimationFrame(idleRaf);
  if(idleTimer) clearInterval(idleTimer);
  idleRaf=idleTimer=null;
  bird.sqX=bird.sqY=1; bird.syncEl();
}
function idle(){
  bird.swap('talk',{loop:false, frame:0, fade:0});
  const t0=performance.now();
  (function b(now){
    const t=(now-t0)/1000;
    bird.sqY = 1 + Math.sin(t*2.0)*.018;
    bird.sqX = 1 - Math.sin(t*2.0)*.014;
    bird.syncEl();
    idleRaf=requestAnimationFrame(b);
  })(t0);
  // occasional twinkle around her
  idleTimer=setInterval(()=>{
    if(Math.random()<.55)
      spawnStar(LAYOUT.bird.footX+rand(-200,200), LAYOUT.bird.footY-rand(60,BIRD_H+40),{g:-.01});
  }, 900);
}

boot().catch(err=>{ console.warn('boot:', err && err.message); revealStart(); });
